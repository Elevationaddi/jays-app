name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, types, unit tests, build, OpenAPI drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: OpenAPI document matches the code
        run: pnpm openapi:check

  integration:
    name: Migrations and integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jays
          POSTGRES_PASSWORD: jays
          POSTGRES_DB: jays_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jays -d jays_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://jays:jays@localhost:5432/jays_test
      REDIS_URL: redis://localhost:6379
      MFA_ENCRYPTION_KEY: local-dev-only-ci-mfa-key-000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm db:migrate
      - name: Re-running migrations is a no-op
        run: pnpm db:migrate
      - run: pnpm test:integration
      - name: Seed data applies and is idempotent
        run: pnpm db:seed && pnpm db:seed
      - name: Encrypted backup restores into an empty database (restore drill)
        env:
          PG_DUMP: docker run --rm -i --network host postgres:17-alpine pg_dump
          PG_RESTORE: docker run --rm -i --network host postgres:17-alpine pg_restore
          PSQL: docker run --rm -i --network host postgres:17-alpine psql
        run: infra/backup/drill.sh

  images:
    name: Container images build and start (staging)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jays
          POSTGRES_PASSWORD: jays
          POSTGRES_DB: jays
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jays -d jays"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build every target
        run: |
          for target in api worker business admin; do
            docker build --target "$target" -t "jays-$target:ci" .
          done
      - name: Migrate and start the API image, then check readiness
        run: |
          # A throwaway token generated per run, so no credential-shaped value is committed.
          metrics_token="$(openssl rand -hex 24)"
          cat > ci.env <<'ENV'
          APP_ENV=staging
          DATABASE_URL=postgresql://jays:jays@127.0.0.1:5432/jays
          REDIS_URL=redis://127.0.0.1:6379
          CORS_ORIGINS=http://localhost:3001
          JWT_KEYS=ci:local-dev-only-ci-jwt-0000000000000000000
          OTP_SECRET=local-dev-only-ci-otp-0000000000000000000
          MFA_ENCRYPTION_KEY=local-dev-only-ci-mfa-0000000000000000000
          STORAGE_BUCKET=jays-ci
          STORAGE_SIGNING_SECRET=local-dev-only-ci-storage-00000000000000
          PSP_WEBHOOK_SECRET=local-dev-only-ci-webhook
          API_URL=http://127.0.0.1:3000/v1
          ENV
          echo "METRICS_TOKEN=$metrics_token" >> ci.env
          docker run --rm --network host --env-file ci.env -w /app/packages/db jays-api:ci node dist/cli.js
          docker run -d --name api --network host --env-file ci.env jays-api:ci
          docker run -d --name worker --network host --env-file ci.env jays-worker:ci
          docker run -d --name business --network host --env-file ci.env jays-business:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:3000/v1/health/ready && break
            sleep 2
          done
          curl -fs http://127.0.0.1:3000/v1/health/ready
          curl -fs -H "authorization: Bearer $metrics_token" http://127.0.0.1:3000/v1/metrics | grep -q '^jays_outbox_pending '
          curl -fs -o /dev/null http://127.0.0.1:3001/sign-in
          test "$(docker inspect -f '{{.State.Running}}' worker)" = true
      - name: Container logs
        if: always()
        run: for c in api worker business; do docker logs "$c" 2>&1 | tail -40 || true; done

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high
