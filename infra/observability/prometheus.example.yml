# Example scrape configuration. The token file holds METRICS_TOKEN and is never committed.
global:
  scrape_interval: 30s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: jays-api
    metrics_path: /v1/metrics
    scheme: https
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/jays-metrics-token
    static_configs:
      - targets: ['api.staging.example.test']
