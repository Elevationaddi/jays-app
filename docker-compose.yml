# Local development dependencies only. Never used for staging or production.
# Start: pnpm dev:deps   Stop: pnpm dev:deps:down   Wipe data: docker compose down -v
name: jays

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jays
      POSTGRES_PASSWORD: jays
      POSTGRES_DB: jays
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jays -d jays']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional real ClamAV for local scanner tests (ADR-0032, CLAMAV_HOSTING_REVIEW.md). Not started by
  # `pnpm dev:deps`: run `docker compose --profile scanner up -d clamav`, wait for the first signature
  # download (several minutes, about 2-3 GB of memory), then set MALWARE_SCANNER=clamav,
  # CLAMAV_HOST=127.0.0.1, CLAMAV_TLS=false. Bound to localhost only: clamd has no authentication.
  clamav:
    image: clamav/clamav:1.4
    profiles: ['scanner']
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

volumes:
  postgres-data:
  redis-data:
  clamav-db:
