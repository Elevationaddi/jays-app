packages:
  - 'apps/*'
  - 'packages/*'

# Dependencies allowed to run install scripts. Everything else is blocked by default.
onlyBuiltDependencies:
  - '@swc/core'
ignoredBuiltDependencies:
  - '@scarf/scarf'
  # sharp ships prebuilt binaries (@img/sharp-*); its install script only builds from source.
  - sharp
